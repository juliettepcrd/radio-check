<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F6F8; --surface: #FFFFFF; --ink: #0E1B2E; --ink2: #5A6678; --line: #E1E5EB;
  --accent: #1F4FD8; --panel: #0E1B2E; --panel-ink: #EAF0F8; --panel-2: #9FB0C7;
  --amber: #F2A516; --ok: #17794F; --ok-bg: #E3F3EA; --miss: #B3321F; --miss-bg: #FBE9E5; --rec: #D6322B;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A121E; --surface: #111D2D; --ink: #EAF0F8; --ink2: #9AA8BB; --line: #223249;
    --accent: #7DA0FF; --panel: #050A12; --panel-ink: #EAF0F8; --panel-2: #8FA1BA;
    --ok: #5FD0A0; --ok-bg: #12301F; --miss: #FF9C8B; --miss-bg: #3A1914; --rec: #FF6B60;
  }
}
:root[data-theme="dark"] {
  --bg: #0A121E; --surface: #111D2D; --ink: #EAF0F8; --ink2: #9AA8BB; --line: #223249;
  --accent: #7DA0FF; --panel: #050A12; --panel-ink: #EAF0F8; --panel-2: #8FA1BA;
  --ok: #5FD0A0; --ok-bg: #12301F; --miss: #FF9C8B; --miss-bg: #3A1914; --rec: #FF6B60;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5; min-height: 100vh; }
.wrap { max-width: 600px; margin: 0 auto; padding: 16px 18px 28px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; letter-spacing: -0.01em; margin: 0; }
.led { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #3A485D; flex: none; }
.led.on, .led.live { background: var(--amber); box-shadow: 0 0 0 4px rgba(242, 165, 22, 0.22); }
.lang { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button { font: 600 14px var(--sans); background: transparent; color: var(--ink2); border: 0; border-radius: 999px; padding: 6px 14px; min-height: 34px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.nav { display: flex; gap: 22px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.nav button { font: 600 16px var(--sans); background: transparent; border: 0; color: var(--ink2); padding: 10px 0; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }

.strip { display: grid; grid-template-columns: 1.3fr 1fr 1fr 0.7fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 20px; }
.strip > div { padding: 8px 12px; border-right: 1px solid var(--line); min-width: 0; }
.strip > div:last-child { border-right: 0; }
.strip small { display: block; font-size: 12.5px; color: var(--ink2); line-height: 1.2; }
.strip b { font: 600 16px var(--mono); display: block; overflow-wrap: anywhere; }
@media (max-width: 460px) {
  .strip { grid-template-columns: 1fr 1fr; }
  .strip > div:nth-child(2) { border-right: 0; }
  .strip > div:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
}

h2 { font-size: 26px; line-height: 1.2; margin: 0 0 10px; font-weight: 700; letter-spacing: -0.015em; }
h3 { font-size: 17px; margin: 26px 0 8px; font-weight: 700; }
p { margin: 0 0 14px; max-width: 60ch; }
.muted { color: var(--ink2); }
.small { font-size: 14.5px; }

.btn { font: 600 17px var(--sans); border-radius: 999px; border: 1.5px solid var(--ink); padding: 0 24px; min-height: 52px; cursor: pointer; background: transparent; color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.grow { flex: 1; }
.btn.link { border: 0; padding: 0 4px; min-height: 44px; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; color: var(--ink2); }
.btn.sm { min-height: 36px; font-size: 15px; }
.btn.ondark { background: var(--panel-ink); color: #0E1B2E; border: 0; min-height: 46px; padding: 0 20px; }
.btn.linkdark { border: 0; background: transparent; color: var(--panel-2); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; padding: 0 4px; font-weight: 500; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, textarea:focus-visible, input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.seg-group { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; margin: 6px 0 10px; }
.seg { position: relative; display: block; }
.seg input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.seg span { display: block; text-align: center; padding: 12px 6px; border-radius: 10px; font-weight: 600; font-size: 15.5px; color: var(--ink2); }
.seg input:checked + span { background: var(--ink); color: var(--bg); }
.lvdesc { min-height: 3em; margin: 0 0 18px; }

ul.scen { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
ul.scen li { border-bottom: 1px solid var(--line); }
ul.scen button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px; text-align: left; background: transparent; color: var(--ink); border: 0; padding: 16px 2px; cursor: pointer; font-family: var(--sans); min-height: 72px; }
ul.scen .st { display: block; font-weight: 600; font-size: 19px; line-height: 1.25; }
ul.scen .sd { display: block; color: var(--ink2); font-size: 15px; margin-top: 2px; }
.dots { display: flex; gap: 7px; flex: none; }
.dots i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--ink2); display: block; }
.dots i.tried { background: var(--amber); border-color: var(--amber); }
.dots i.pass { background: var(--ok); border-color: var(--ok); }
.legend { font-size: 14px; color: var(--ink2); margin: 12px 0 0; }

.steps { display: flex; gap: 5px; margin-bottom: 12px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); display: block; }
.steps i.done { background: var(--ink); }
.steps i.cur { background: var(--accent); }
.stepmeta { color: var(--ink2); font-size: 15px; margin: 0 0 4px; }

.rx { background: var(--panel); color: var(--panel-ink); border-radius: 18px; padding: 16px 18px 18px; margin: 14px 0 12px; }
.rxhead { display: flex; align-items: center; gap: 10px; color: var(--panel-2); font-weight: 600; font-size: 15px; margin-bottom: 12px; }
.rx .note { color: var(--panel-2); font-size: 15px; margin: 0 0 12px; }
.rx .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.rx .line { font: 500 18px/1.5 var(--mono); margin: 14px 0 0; }
.rx dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; }
.rx dt { color: var(--panel-2); font-size: 15px; }
.rx dd { margin: 0; font: 600 16.5px/1.4 var(--mono); }
.hint { color: var(--ink2); font-size: 14.5px; margin: 0 0 14px; }

.fieldhead { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.fieldhead label { font-weight: 600; font-size: 15px; color: var(--ink2); }
textarea { width: 100%; min-height: 104px; resize: vertical; font: 500 16.5px/1.5 var(--mono); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.status { margin: 8px 0 0; font-size: 14.5px; color: var(--ink2); min-height: 1.5em; }
.err { color: var(--miss); font-weight: 600; font-size: 15px; min-height: 1.4em; margin: 2px 0 0; }

.bar { position: sticky; bottom: 0; display: flex; gap: 12px; align-items: center; margin: 14px -18px 0; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 72%, rgba(0, 0, 0, 0)); }
.mic { width: 60px; height: 60px; border-radius: 50%; border: 0; cursor: pointer; flex: none; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.mic svg { width: 28px; height: 28px; }
.mic.on { background: var(--rec); color: #fff; animation: pulse 1.4s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(214, 50, 43, 0.45); } 100% { box-shadow: 0 0 0 18px rgba(214, 50, 43, 0); } }
@media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } }

.score { font: 700 44px/1.1 var(--sans); letter-spacing: -0.02em; margin: 18px 0 2px; }
ul.checks { list-style: none; padding: 0; margin: 10px 0 18px; border-top: 1px solid var(--line); }
ul.checks li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
ul.checks .mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
ul.checks .ok .mark { background: var(--ok-bg); color: var(--ok); }
ul.checks .miss .mark { background: var(--miss-bg); color: var(--miss); }
ul.checks .word { font-size: 14.5px; color: var(--ink2); }
.model { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 6px; }
.model small { display: block; color: var(--ink2); font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.model div { font: 500 16.5px/1.5 var(--mono); }

table.sum { width: 100%; border-collapse: collapse; margin: 8px 0 14px; }
table.sum td, table.sum th { text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); font-weight: 400; vertical-align: top; }
table.sum thead th { font-weight: 600; font-size: 14.5px; color: var(--ink2); }
table.sum td.n { font: 600 16px var(--mono); text-align: right; white-space: nowrap; }
.big { font: 700 44px/1.1 var(--sans); letter-spacing: -0.02em; margin: 4px 0 2px; }
.verdict { background: var(--ok-bg); color: var(--ok); border-radius: 12px; padding: 12px 16px; margin: 14px 0; font-weight: 600; }
.verdict.no { background: var(--miss-bg); color: var(--miss); }
ul.plain { margin: 0 0 6px; padding-left: 20px; max-width: 60ch; }
ul.plain li { margin-bottom: 8px; }
ul.plain.red li::marker { color: var(--miss); }
.foot { margin-top: 28px; font-size: 13.5px; color: var(--ink2); max-width: 60ch; }
.hidden { display: none; }
.actions { margin: 14px 0; }
.ai { margin: 6px 0 22px; padding: 16px 16px 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.aih { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; font-size: 18px; }
.ctx { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin: 12px 0 6px; }
@media (max-width: 460px) { .ctx { grid-template-columns: 1fr; } }
.ctx label { display: block; font-size: 14.5px; font-weight: 600; color: var(--ink2); margin-bottom: 4px; }
.ctx select, .ctx input[type="text"] { width: 100%; min-height: 48px; font: 500 16px var(--sans); border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); padding: 0 12px; }
.ctx select:focus-visible, .ctx input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sheet h4 { font-size: 16px; margin: 18px 0 6px; font-weight: 700; }
.phr div { font: 500 15.5px/1.45 var(--mono); background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
.fix { border-top: 1px solid var(--line); padding: 10px 0; }
.fix b { display: block; margin-bottom: 2px; }
.fix .say { font: 500 15.5px/1.45 var(--mono); background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
.ctx .wide { grid-column: 1 / -1; }
.bls { margin: 8px 0 6px; border-top: 1px solid var(--line); }
.bl { padding: 14px 0; border-bottom: 1px solid var(--line); }
.bl .say { font: 500 16.5px/1.55 var(--mono); margin: 0 0 8px; max-width: none; }
.bl .say b { font-weight: 700; }
.bl .why { margin: 0; max-width: 62ch; color: var(--ink2); font-size: 15px; padding-left: 12px; border-left: 3px solid var(--miss); }
mark.todo { background: rgba(242, 165, 22, 0.28); color: var(--ink); border-radius: 4px; padding: 0 5px; font-weight: 600; }
.count { font-weight: 600; font-size: 15.5px; margin: 6px 0 12px; max-width: 62ch; }
.count.warn { color: var(--miss); }
details.rules { margin: 0 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 14px; }
details.rules summary { cursor: pointer; font-weight: 600; min-height: 48px; display: flex; align-items: center; }
details.rules ul { margin-top: 0; padding-bottom: 8px; }
.seg-group.two { grid-template-columns: 1fr 1fr; }
.bl .srcl { margin: 6px 0 0; font-size: 13.5px; color: var(--ink2); max-width: none; }
.mod { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 6px 14px; margin-bottom: 10px; }
.mod.on { border-color: var(--ink); }
.chk { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 8px 0; cursor: pointer; }
.chk input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--ink); }
.chk b { display: block; font-weight: 600; }
.chk small { display: block; color: var(--ink2); font-size: 14.5px; line-height: 1.4; }
.mod .ctx { margin: 4px 0 10px; }
details.rules a { color: var(--accent); }
.seg-group.four { grid-template-columns: 1fr 1fr; }
.seg-group.four .seg span { padding: 12px 8px; font-size: 15px; }
.exq { margin: 0 0 14px; }
.exq .qt { margin: 12px 0 6px; max-width: none; }
h4.qh { font-size: 16px; margin: 18px 0 4px; font-weight: 700; }
.nav { gap: 16px; overflow-x: auto; }
.nav button { white-space: nowrap; }
.demo { background: rgba(242, 165, 22, 0.16); border: 1px solid rgba(242, 165, 22, 0.55); border-radius: 12px; padding: 10px 14px 4px; margin: 10px 0 14px; }
.demo p { margin: 0 0 4px; font-size: 14.5px; max-width: none; }
.demo .btn.link { min-height: 36px; padding-left: 0; }
.alpha { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; margin: 8px 0 14px; }
.alpha div { display: flex; align-items: baseline; gap: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 6px 10px; }
.alpha b { font: 600 17px var(--mono); }
.alpha span { font-size: 14.5px; color: var(--ink2); }
th.mono { font: 600 16px var(--mono); white-space: nowrap; padding-right: 14px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 10px; margin: 8px 0 6px; }
.qq { font-size: 21px; line-height: 1.35; font-weight: 600; margin: 4px 0 8px; max-width: none; }
.streak { font-weight: 600; margin: 0 0 6px; }
.suggest { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
.suggest .btn.link { color: var(--ink); font-weight: 600; font-size: 17px; min-height: 36px; }
@media print {
  body { background: #fff !important; color: #000 !important; }
  .nav, .top .lang, .bar, .btn, .demo, .actions, .ai .actions, details.rules:not([open]) { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .bl .why { color: #333; }
}

/* ===== v10 visual refresh ===== */
:root { --display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif; --shadow: 0 1px 2px rgba(14, 27, 46, 0.05), 0 12px 28px -16px rgba(14, 27, 46, 0.28); --tabh: 66px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --shadow: 0 14px 30px -18px rgba(0, 0, 0, 0.75); } }
:root[data-theme="dark"] { --shadow: 0 14px 30px -18px rgba(0, 0, 0, 0.75); }
body { background-color: var(--bg); background-image: radial-gradient(130% 46% at 50% -12%, rgba(31, 79, 216, 0.11), transparent 62%); background-repeat: no-repeat; }
.wrap { padding-bottom: calc(var(--tabh) + 40px + env(safe-area-inset-bottom, 0px)); }
.brand, h2, h3.sec, .big, .score, .qq, ul.scen .st, .hero h2 { font-family: var(--display); }
.brand { font-size: 25px; font-weight: 700; letter-spacing: -0.025em; }
h2 { font-size: 30px; letter-spacing: -0.025em; font-weight: 700; line-height: 1.12; }
h3.sec { font-size: 19px; font-weight: 700; margin: 8px 0 10px; letter-spacing: -0.01em; }
.top { margin-bottom: 14px; }
.btn { transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease; }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn.primary { box-shadow: 0 8px 18px -10px rgba(14, 27, 46, 0.6); }
.btn.light { background: #EAF0F8; color: #0E1B2E; border: 0; min-height: 46px; padding: 0 20px; box-shadow: none; }

/* bottom tab bar */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; gap: 0; margin: 0; overflow: visible;
  padding: 6px max(6px, calc((100vw - 600px) / 2)) calc(6px + env(safe-area-inset-bottom, 0px)); min-height: var(--tabh);
  background: var(--surface); border-top: 1px solid var(--line); border-bottom: 0; }
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 2px; margin: 0; border: 0; border-bottom: 0;
  background: transparent; color: var(--ink2); position: relative; min-width: 0; }
.nav button svg { width: 24px; height: 24px; }
.nav button span { font: 600 12px var(--sans); white-space: nowrap; }
.nav button[aria-current="page"] { color: var(--ink); border-bottom: 0; }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: -7px; left: 50%; width: 30px; height: 3px; margin-left: -15px; border-radius: 0 0 4px 4px; background: var(--ink); }
.bar { bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px)); padding-bottom: 12px; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 26px 22px 22px; margin: 4px 0 22px; color: #EAF0F8;
  background: radial-gradient(120% 90% at 100% 0%, rgba(125, 160, 255, 0.38), transparent 56%), linear-gradient(155deg, #0E1B2E 0%, #15305E 100%); box-shadow: var(--shadow); }
.hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; color: rgba(234, 240, 248, 0.16); pointer-events: none; }
.hero > *:not(.hero-bg) { position: relative; }
.hero h2 { font-size: 36px; line-height: 1.04; margin: 0 0 10px; max-width: 11ch; color: #fff; letter-spacing: -0.03em; font-weight: 800; }
.hero p { color: rgba(234, 240, 248, 0.82); margin: 0 0 14px; max-width: 34ch; }
.hero .streak { display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 14.5px; color: #fff; margin: 0 0 14px; }
.flame { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px rgba(242, 165, 22, 0.28); flex: none; }
.hero .suggest { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0; }
.hero .suggest .small { color: rgba(234, 240, 248, 0.72); }

/* controls */
.seg-group { border-radius: 16px; box-shadow: var(--shadow); }
.seg span { transition: background 0.15s ease, color 0.15s ease; }
.seg input:checked + span { box-shadow: 0 4px 12px -4px rgba(14, 27, 46, 0.5); }

/* exercise cards */
ul.scen { border-top: 0; display: grid; gap: 10px; margin: 0; }
ul.scen li { border-bottom: 0; }
ul.scen button { justify-content: flex-start; gap: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 14px; min-height: 78px; box-shadow: var(--shadow); transition: transform 0.12s ease, border-color 0.15s ease; }
ul.scen button:hover { border-color: var(--ink2); }
ul.scen button:active { transform: scale(0.985); }
ul.scen .stx { flex: 1; min-width: 0; }
ul.scen .st { font-weight: 700; font-size: 18.5px; letter-spacing: -0.01em; }
.ico { width: 46px; height: 46px; border-radius: 14px; background: var(--bg); color: var(--ink); display: grid; place-items: center; flex: none; border: 1px solid var(--line); }
.ico svg { width: 24px; height: 24px; }
ul.scen .dots { margin-left: auto; }

/* radio panel */
.rx { background: linear-gradient(180deg, #14263F 0%, var(--panel) 100%); border-radius: 22px; box-shadow: var(--shadow); }
.wave { display: none; margin-left: auto; gap: 3px; align-items: center; height: 20px; }
.led.live ~ .wave { display: inline-flex; }
.wave i { width: 3px; height: 6px; border-radius: 2px; background: var(--amber); animation: wv 0.9s ease-in-out infinite; }

  function buildFlightPrompt() {
    var data = {};
    FB_KEYS.forEach(function (k) { data[k] = (S.fb[k] || '').trim(); });
    data.limit = S.fb.limit === 'oui' ? 'limiting' : 'not limiting';
    data.main = S.fb.main === 'L' ? 'left' : S.fb.main === 'R' ? 'right' : '';
    var mods = FB_MODS.filter(function (m) { return S.fb[m.k] === '1'; }).map(function (m) { return m.l.en; });
    data.briefing_type = { depart: 'departure briefing at the parking spot', secu: 'takeoff safety briefing at the holding point', arrivee: 'arrival briefing in flight before the descent', atterro: 'landing safety briefing before the final approach' }[S.fb.type];
    data.addons_enabled = mods;
    return [
      'You are an assistant to a flight instructor in France, helping a student pilot deliver a briefing in the style taught by the instructor and by European and French safety sources: short, contextual, about 7 to 10 items at most, never recited mechanically, followed by a sterile cockpit.',
      'Language: ' + (S.lang === 'fr' ? 'French' : 'English') + '.',
      'The student has filled in these data (JSON, empty string = not provided): ' + JSON.stringify(data),
      'The briefing is already built from these data, including the add-ons listed in addons_enabled. Do not repeat what it already says.',
      'Your task, without changing any number:',
      '1. "a_faire": 4 or 5 short pieces of advice to deliver this briefing well and prepare the phase of flight, adapted to the aircraft and conditions.',
      '2. "a_ne_pas_faire": 4 or 5 short typical pitfalls (briefing technique and this phase of flight).',
      '3. "ajouts": at most 2 optional items to add because of the conditions or the aircraft (for example crosswind, limiting runway, heat). Each is {"phrase": first-person sentence the student would say, "explication": why}. Use no number the student did not provide. Empty list if nothing is relevant.',
      '4. "verifications": 0 to 4 short remarks about missing or inconsistent data (a blank field, an enabled add-on whose fields are blank, speeds that look inconsistent). Never correct a number yourself: ask the student to check the flight manual and the VAC chart.',
      'Rules: never invent speeds, headings, heights, procedures or regulations. Do not contradict the data. Each string is at most 22 words.',
      'Reply with only a JSON object: {"a_faire": [strings], "a_ne_pas_faire": [strings], "ajouts": [{"phrase": string, "explication": string}], "verifications": [strings]}'
    ].join('\n');
  }

  function fbField(f, lang) {
    var val = S.fb[f.k] || '', id = 'f-' + f.k;
    if (f.t === 'select') {
      return '<div><label for="' + id + '">' + esc(f.l[lang]) + '</label><select id="' + id + '" data-fb="' + f.k + '">' + f.opts[lang].map(function (o) {
        return '<option value="' + esc(o[0]) + '"' + (val === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
      }).join('') + '</select></div>';
    }
    if (f.t === 'area') return '<div class="wide"><label for="' + id + '">' + esc(f.l[lang]) + '</label><textarea id="' + id + '" data-fb="' + f.k + '" placeholder="' + esc(f.ph[lang]) + '" style="min-height:76px" autocomplete="off">' + esc(val) + '</textarea></div>';
    return '<div><label for="' + id + '">' + esc(f.l[lang]) + '</label><input type="text" id="' + id + '" data-fb="' + f.k + '" value="' + esc(val) + '" placeholder="' + esc(f.ph[lang]) + '" autocomplete="off" autocapitalize="off"></div>';
  }

  function demoBanner(kind) {
    var fr = S.lang === 'fr';
    return '<div class="demo" role="note"><p>' + (fr ? "Données d'exemple fictives : remplace-les par les tiennes avant de t'en servir. Les valeurs de ton avion viennent de ton manuel de vol et de la carte VAC." : 'Fictional example data: replace it with your own before using it. Your aircraft values come from your flight manual and the VAC chart.') + '</p><button type="button" class="btn link sm" data-act="' + kind + '">' + (fr ? "Tout effacer et saisir les miennes" : 'Clear all and enter mine') + '</button></div>';
  }
  function typeToggle(T) {
    return '<div class="seg-group four" role="radiogroup" aria-label="' + esc(T.title) + '">' + ['depart', 'secu', 'arrivee', 'atterro'].map(function (k) {
      return '<label class="seg"><input type="radio" name="fbtype" value="' + k + '" data-act="fbtype"' + (S.fb.type === k ? ' checked' : '') + '><span>' + esc(T.types[k]) + '</span></label>';

    } else if (act === 'toggletext') { S.showAtc = !S.showAtc; render(); }
    else if (act === 'mic') { toggleMic(); }
    else if (act === 'clear') {
      S.text = ''; S.error = ''; var ta = document.getElementById('say'); if (ta) { ta.value = ''; ta.focus(); }
      var er = document.getElementById('err'); if (er) er.textContent = '';
    } else if (act === 'check') {
      var ta2 = document.getElementById('say'); if (ta2) S.text = ta2.value;
      if (!norm(S.text)) { S.error = C0.ui.empty; var er2 = document.getElementById('err'); if (er2) er2.textContent = S.error; return; }
      stopAll(); S.error = '';
      if (S.retry) { S.last = grade(steps[S.i], S.text); S.phase = 'result'; render(); return; }
      S.last = grade(steps[S.i], S.text); S.transcripts[S.i] = S.text; S.checksLog[S.i] = S.last;
      S.results[S.i] = { ok: S.last.filter(function (c) { return c.ok; }).length, total: S.last.length };
      S.last.forEach(function (c) { var a = S.attemptCats[c.cat] || [0, 0]; a[1] += 1; if (c.ok) a[0] += 1; S.attemptCats[c.cat] = a; });
      S.phase = 'result'; render();
    } else if (act === 'next') {
      if (S.i + 1 < steps.length) { S.i += 1; S.phase = 'answer'; S.text = ''; S.showAtc = false; S.listens = 0; S.last = null; S.retry = false; }
      else { S.view = 'summary'; }
      render(); window.scrollTo(0, 0);
    } else if (act === 'reset') {
      if (!S.resetArm) { S.resetArm = true; render(); }
      else { P = { attempts: [], cats: {}, best: {} }; saveP(P); S.resetArm = false; render(); }
    }
  });
  document.addEventListener('input', function (e) { if (e.target && e.target.id === 'say') S.text = e.target.value; });
  function fbSet(e) { var k = e.target && e.target.getAttribute && e.target.getAttribute('data-fb'); if (k) { S.fb[k] = e.target.value; S.fb.demo = ''; saveFB(); } }
  document.addEventListener('input', fbSet);
  document.addEventListener('change', fbSet);
  function exSet(e) { var t = e.target, g = t && t.getAttribute && t.getAttribute('data-ex'); if (g) { S.ex[g] = t.value; S.ex.demo = ''; saveEX(); return; } var a = t && t.getAttribute && t.getAttribute('data-exa'); if (a !== null && a !== undefined) { S.exA[parseInt(a, 10)] = t.value; } }
  document.addEventListener('input', exSet);
  document.addEventListener('change', exSet);
  function miscSet(e) {
    var t = e.target; if (!t || !t.getAttribute) return;
    if (t.getAttribute('data-qtheme')) { S.q.theme = t.value; quizBuild(); render(); }
    else if (t.getAttribute('data-noise')) { S.noise = !!t.checked; try { localStorage.setItem('rc-noise', S.noise ? '1' : '0'); } catch (e2) {} }
    else if (t.id === 'callin') { S.callDraft = t.value; }
  }
  document.addEventListener('change', miscSet);
  document.addEventListener('input', miscSet);
  function fbModSet(e) { var t = e.target, k = t && t.getAttribute && t.getAttribute('data-fbmod'); if (k) { S.fb[k] = t.checked ? '1' : ''; saveFB(); render(); var b = document.getElementById('m-' + k); if (b && b.focus) b.focus(); } }
  document.addEventListener('change', fbModSet);
  function ctxSet(e) { var k = e.target && e.target.getAttribute && e.target.getAttribute('data-ctx'); if (k) S.ctx[k] = e.target.value; }
  document.addEventListener('input', ctxSet);
  document.addEventListener('change', ctxSet);

  render();
})();
</script>
